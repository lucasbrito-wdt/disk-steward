[package]
name = "disk-steward"
version = "0.1.0"
edition = "2024"
description = "Disk Steward: APFS compression control panel for dev machines"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
steward-core = { path = "../crates/steward-core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
sys-locale = "0.3"
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"

[dev-dependencies]
tempfile = "3"
